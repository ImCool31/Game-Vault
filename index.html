
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Vault</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #090b14;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  background: #111526;
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #292e42;
}
.logo { font-size: 25px; font-weight: bold; color: #8b6cff; }
main { max-width: 900px; margin: auto; padding: 25px; }
h1 { font-size: 36px; }
.card {
  background: #151a2b;
  padding: 22px;
  border-radius: 14px;
  margin: 20px 0;
  border: 1px solid #292e42;
}
input {
  display: block;
  width: 100%;
  padding: 13px;
  margin: 12px 0;
  background: #090d19;
  border: 1px solid #343b55;
  border-radius: 8px;
  color: white;
}
button {
  padding: 12px 18px;
  background: #7655ee;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  margin: 5px 3px;
}
button:hover { background: #9278ff; }
.secondary { background: #343b55; }
#message { color: #b8a8ff; }
table { width: 100%; border-collapse: collapse; }
td, th { padding: 12px; text-align: left; border-bottom: 1px solid #343b55; }
.hidden { display: none; }
</style>
</head>
<body>

<header>
  <div class="logo">🎮 GAME VAULT</div>
  <button onclick="showAuth()">Account</button>
</header>

<main>
  <h1>Welcome to Game Vault</h1>
  <p>Your ultimate gaming destination.</p>

  <section class="card">
    <h2>👤 Your Account</h2>
    <div id="auth">
      <input id="username" placeholder="Username">
      <input id="email" type="email" placeholder="Email">
      <input id="password" type="password" placeholder="Password">
      <button onclick="signUp()">Create Account</button>
      <button class="secondary" onclick="signIn()">Login</button>
    </div>
    <div id="loggedIn" class="hidden">
      <p id="welcome"></p>
      <button onclick="signOut()">Logout</button>
    </div>
    <p id="message"></p>
  </section>

  <section class="card">
    <h2>🏆 Leaderboard</h2>
    <table>
      <thead>
        <tr>
          <th>Rank</th>
          <th>Username</th>
          <th>Points</th>
        </tr>
      </thead>
      <tbody id="leaderboard">
        <tr><td colspan="3">Loading...</td></tr>
      </tbody>
    </table>
    <button onclick="loadLeaderboard()">Refresh</button>
  </section>

  <section class="card">
    <h2>🎮 Games</h2>
    <p>Our game collection is coming soon!</p>
  </section>
</main>

<script>
const SUPABASE_URL = "sb_publishable_IFNawnICgcaH74YC9WRn1w_9GgiMYaF";
const SUPABASE_KEY = "https://zwrwkcgnvaomxzuyqwdc.supabase.co/rest/v1/";
const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

function message(text) {
  document.getElementById("message").textContent = text;
}

async function signUp() {
  const username = document.getElementById("username").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!username || !email || !password) {
    message("Please fill in all fields.");
    return;
  }

  const { error } = await db.auth.signUp({
    email,
    password,
    options: {
      data: { username: username }
    }
  });

  if (error) {
    message(error.message);
  } else {
    message("Account created! Check your email if confirmation is required.");
  }
}

async function signIn() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { error } = await db.auth.signInWithPassword({
    email,
    password
  });

  if (error) message(error.message);
  else message("Login successful!");
}

async function signOut() {
  const { error } = await db.auth.signOut();
  if (error) message(error.message);
}

function showAuth() {
  document.getElementById("auth").scrollIntoView({
    behavior: "smooth"
  });
}

async function updateAccount(session) {
  const auth = document.getElementById("auth");
  const loggedIn = document.getElementById("loggedIn");

  if (session) {
    auth.classList.add("hidden");
    loggedIn.classList.remove("hidden");

    const username =
      session.user.user_metadata.username ||
      session.user.email;

    document.getElementById("welcome").textContent =
      "Welcome, " + username + "!";
  } else {
    auth.classList.remove("hidden");
    loggedIn.classList.add("hidden");
  }
}

async function loadLeaderboard() {
  const tbody = document.getElementById("leaderboard");

  const { data, error } = await db
    .from("profiles")
    .select("username, total_points")
    .order("total_points", { ascending: false })
    .limit(10);

  if (error) {
    tbody.innerHTML =
      "<tr><td colspan='3'>Could not load leaderboard.</td></tr>";
    console.error(error);
    return;
  }

  if (!data || data.length === 0) {
    tbody.innerHTML =
      "<tr><td colspan='3'>No players yet!</td></tr>";
    return;
  }

  tbody.innerHTML = data.map((player, index) => `
    <tr>
      <td>${index + 1}</td>
      <td>${escapeHTML(player.username)}</td>
      <td>${player.total_points}</td>
    </tr>
  `).join("");
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

db.auth.onAuthStateChange((event, session) => {
  updateAccount(session);
});

(async () => {
  const { data } = await db.auth.getSession();
  updateAccount(data.session);
  loadLeaderboard();
})();
</script>

</body>
</html>
